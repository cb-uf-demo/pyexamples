apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: build
on:
  workflow_dispatch:
    inputs:
      image-name:
        type: string
        required: true
        default: pyexamples
  workflow_call:
    inputs:
      image-name:
        type: string
        required: true
        default: pyexamples
jobs:
  build:
    steps:
      - uses: cloudbees-io/checkout@v2
        name: Get source code

      - name: Sign in to OCI registry
        uses: https://github.com/cloudbees-io/configure-oci-credentials@v1
        with:
          registry: ${{ vars.OCI_REGISTRY }}
          username: ${{ secrets.OCI_USERNAME }}
          password: ${{ secrets.OCI_PASSWORD }}
    
      - uses: docker://alpine:latest
        run: |
            pwd
            ls
            ls .config/

      # Build image (tar file)
      - name: Build image
        uses: docker://gcr.io/kaniko-project/executor:v1.23.2-debug
        kind: build
        id: build-image
        run: |
          /kaniko/executor \
            --context "$CLOUDBEES_WORKSPACE" \
            --dockerfile Dockerfile \
            --no-push \
            --tar-path "${{ inputs.image-name }}.tar" \
            --destination "${{ inputs.image-name }}:${{ cloudbees.scm.sha }}" \
            --digest-file "digest.txt"

      - name: Export Image Digest
        uses: docker://alpine:latest
        id: image-digest
        run: |
          DIGEST=$(cat "$CLOUDBEES_WORKSPACE/digest.txt")
          echo "$DIGEST" > "$CLOUDBEES_OUTPUTS/IMAGE_DIGEST"

      # Scan it
      - name: Snyk Container Scan
        uses: docker://snyk/snyk:docker
        shell: sh
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_SECRET }}
        run: |
          snyk container test \
            --org=${{ vars.SNYK_ORG }} \
            --severity-threshold=high \
            --file=Dockerfile \
            docker-archive:${{ inputs.image-name }}.tar || true # Remove the || true for it to properly gate

      # Upload to ASPM
      - id: upload-binary
        name: Upload binary using action
        uses: https://github.com/cloudbees-io/asset-chain-utils/upload-binary@v1
        with:
          file-path: "${{ inputs.image-name }}.tar"
          file-type: BINARY_CONTAINER

      # Push it
      - name: Push image to registry
        uses: docker://gcr.io/go-containerregistry/crane:debug
        run: |
          crane push "${{ inputs.image-name }}.tar" "${{ secrets.OCI_USERNAME }}/${{ inputs.image-name }}:${{ cloudbees.scm.sha }}"

      # Register build artifact
      - name: Register an artifact with the platform
        id: register
        uses: cloudbees-io/register-build-artifact@v2
        with:
          name: ${{ inputs.image-name }}
          url: ${{ vars.OCI_REGISTRY }}${{ secrets.OCI_USERNAME }}/${{ inputs.image-name }}:${{ cloudbees.scm.sha }}
          version: ${{ cloudbees.scm.sha }}
          digest: ${{ steps.image-digest.outputs.IMAGE_DIGEST }}
