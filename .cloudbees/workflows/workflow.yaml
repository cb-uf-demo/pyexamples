apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: full-workflow
on:
  workflow_dispatch:
jobs:
  tests:
    uses: ./.cloudbees/workflows/test.yaml
    vars: inherit
  snyk:
    needs:
      - tests
    uses: ./.cloudbees/workflows/snyk.yaml
    vars: inherit
    secrets: inherit
  sonar:
    needs:
      - tests
    uses: ./.cloudbees/workflows/sonar.yaml
    vars: inherit
    secrets: inherit
  build:
    needs:
      - snyk
      - sonar
    uses: ./.cloudbees/workflows/build.yaml
    vars: inherit
    secrets: inherit
    with:
      image-name: pyexamples
